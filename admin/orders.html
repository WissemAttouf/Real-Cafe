<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes — Real Cafe Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<style>
  body{background:var(--ink); color:var(--cream); font-family:var(--font-b); margin:0;}
  .admin-wrap{max-width:1200px; margin:0 auto; padding:2rem 1.5rem;}
  .admin-header{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:2rem; flex-wrap:wrap;}
  .admin-title{font-family:var(--font-d); font-size:1.5rem; margin:0;}
  .admin-nav{display:flex; gap:1.2rem; font-size:0.88rem; margin-top:0.8rem;}
  .admin-nav a{color:var(--muted); text-decoration:none;}
  .admin-nav a:hover{color:var(--cream);}
  .admin-nav a.active{color:var(--amber-2); font-weight:600;}

  .admin-btn{display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.1rem; border-radius:2px; border:1px solid var(--amber); background:var(--amber); color:var(--ink); font-weight:600; font-size:0.88rem; cursor:pointer; text-decoration:none; font-family:inherit;}
  .admin-btn:hover{background:var(--amber-2);}
  .admin-btn.secondary{background:transparent; color:var(--cream); border-color:var(--line-strong);}
  .admin-btn.secondary:hover{border-color:var(--cream);}

  .admin-login{max-width:360px; margin:6rem auto; padding:2rem; border:1px solid var(--line-strong); border-radius:3px; background:var(--ink-2);}
  .admin-login h2{font-family:var(--font-d); font-size:1.2rem; margin:0 0 1.2rem;}
  .admin-login input{width:100%; padding:0.75rem 0.85rem; background:transparent; color:var(--cream); border:1px solid var(--line-strong); border-radius:2px; font-family:inherit; font-size:0.95rem; margin-bottom:1rem;}
  .admin-login input:focus{outline:none; border-color:var(--amber-2);}
  .admin-login button{width:100%; padding:0.75rem 1rem; background:var(--amber); color:var(--ink); border:1px solid var(--amber); border-radius:2px; font-weight:600; cursor:pointer; font-family:inherit;}
  .admin-login button:hover{background:var(--amber-2);}
  .admin-err{color:#D98A6B; font-size:0.85rem; min-height:1.2em; margin-top:0.5rem;}

  .admin-filters{display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem; padding:1rem; border:1px solid var(--line); border-radius:3px; background:var(--ink-2);}
  .admin-filters label{font-size:0.8rem; color:var(--muted);}
  .admin-filters input, .admin-filters select{padding:0.5rem 0.7rem; background:transparent; color:var(--cream); border:1px solid var(--line-strong); border-radius:2px; font-family:inherit; font-size:0.88rem;}
  .admin-filters input:focus, .admin-filters select:focus{outline:none; border-color:var(--amber-2);}
  .admin-filters .count{margin-left:auto; color:var(--muted); font-size:0.85rem;}

  .admin-orders{display:flex; flex-direction:column; gap:0.8rem;}
  .admin-order{border:1px solid var(--line); border-radius:3px; background:var(--ink-2); overflow:hidden;}
  .admin-order-head{display:grid; grid-template-columns:auto 1fr auto auto; gap:1rem; align-items:center; padding:1rem 1.2rem; cursor:pointer;}
  .admin-order-head:hover{background:rgba(246,238,221,0.03);}
  .admin-order-num{font-family:var(--font-d); color:var(--amber-2); font-size:0.95rem; font-weight:600;}
  .admin-order-info{display:flex; flex-direction:column; gap:0.2rem; font-size:0.88rem; min-width:0;}
  .admin-order-info strong{color:var(--cream);}
  .admin-order-info span{color:var(--muted); font-size:0.82rem;}
  .admin-order-total{font-family:var(--font-d); font-size:1.1rem; color:var(--cream); font-weight:600;}
  .admin-status{font-size:0.72rem; padding:0.25rem 0.7rem; border-radius:99px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;}
  .admin-status.pending{background:rgba(206,156,73,0.15); color:#E4BC72;}
  .admin-status.confirmed{background:rgba(126,140,110,0.2); color:#A4B894;}
  .admin-status.preparing{background:rgba(228,188,114,0.2); color:#E4BC72;}
  .admin-status.shipped{background:rgba(107,141,180,0.2); color:#9AB8DC;}
  .admin-status.delivered{background:rgba(126,140,110,0.3); color:#7E8C6E;}
  .admin-status.cancelled{background:rgba(154,107,84,0.2); color:#D98A6B;}

  .admin-order-body{display:none; padding:0 1.2rem 1.2rem; border-top:1px solid var(--line);}
  .admin-order.open .admin-order-body{display:block; padding-top:1.2rem;}
  .admin-order-body h4{font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:0 0 0.6rem;}
  .admin-order-details{display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.2rem;}
  .admin-order-details p{font-size:0.88rem; margin:0 0 0.3rem; color:var(--muted);}
  .admin-order-details p strong{color:var(--cream);}
  .admin-items-table{width:100%; border-collapse:collapse; font-size:0.88rem; margin-bottom:1.2rem;}
  .admin-items-table th{text-align:left; padding:0.5rem 0; border-bottom:1px solid var(--line); font-size:0.72rem; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:0.04em;}
  .admin-items-table td{padding:0.5rem 0; border-bottom:1px solid var(--line);}
  .admin-items-table tr:last-child td{border-bottom:none;}
  .admin-order-actions{display:flex; gap:0.5rem; flex-wrap:wrap;}
  .admin-status-btn{padding:0.5rem 0.9rem; border-radius:2px; border:1px solid var(--line-strong); background:transparent; color:var(--cream); cursor:pointer; font-size:0.82rem; font-family:inherit; transition:border-color .2s ease, background-color .2s ease;}
  .admin-status-btn:hover{border-color:var(--amber-2); color:var(--amber-2);}
  .admin-status-btn.current{border-color:var(--amber); background:var(--amber); color:var(--ink); font-weight:600;}

  @media (max-width:700px){
    .admin-order-head{grid-template-columns:1fr auto; gap:0.5rem;}
    .admin-order-details{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="admin-login" id="loginScreen">
  <h2>Back-office commandes</h2>
  <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password">
  <button id="loginBtn">Entrer</button>
  <div class="admin-err" id="loginErr"></div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="adminScreen" style="display:none;">
  <div class="admin-header">
    <div>
      <h1 class="admin-title">Commandes</h1>
      <nav class="admin-nav">
        <a href="/admin/">Réservations</a>
        <a href="/admin/products.html">Produits</a>
        <a href="/admin/orders.html" class="active">Commandes</a>
      </nav>
    </div>
    <div style="display:flex; gap:0.6rem;">
      <button class="admin-btn secondary" id="exportBtn">Export CSV</button>
      <button class="admin-btn secondary" id="refreshBtn">Rafraîchir</button>
      <button class="admin-btn secondary" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="admin-filters">
    <label for="f-status">Statut</label>
    <select id="f-status">
      <option value="">Tous</option>
      <option value="pending">En attente</option>
      <option value="confirmed">Confirmée</option>
      <option value="preparing">En préparation</option>
      <option value="shipped">Expédiée</option>
      <option value="delivered">Livrée</option>
      <option value="cancelled">Annulée</option>
    </select>

    <label for="f-from">Du</label>
    <input type="date" id="f-from">

    <label for="f-to">Au</label>
    <input type="date" id="f-to">

    <span class="count" id="count">—</span>
  </div>

  <div class="admin-orders" id="ordersList">
    <p style="color:var(--muted); text-align:center; padding:2rem;">Chargement…</p>
  </div>
</div>

<script src="/admin/orders.js"></script>
</body>
</html>
